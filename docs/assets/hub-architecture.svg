<text x="338" y="713" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Private server storage</text>
<text x="60" y="982" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="start">SOURCE DATA: ON-DEMAND API READS / OWNER UPLOADS / WEBHOOK PUSH</text>
