<rect x="60" y="1040" width="330" height="130" rx="14" fill="#edf7f4" stroke="#9bcebf" stroke-width="1.5"/>
<text x="80" y="1074" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Google accounts</text>
<text x="80" y="1105" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Gmail / GCal / Drive / ...</text>
<text x="80" y="1133" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Browser OAuth per service/account</text>
<text x="80" y="1161" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Managed token refresh</text>
<rect x="440" y="1040" width="330" height="130" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="460" y="1074" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Manual source credentials</text>
<text x="460" y="1105" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Graph / SaaS / Bot / DAV</text>
<text x="460" y="1133" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Owner token or app password</text>
<text x="460" y="1161" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Operator-controlled renewal</text>
<rect x="820" y="1040" width="330" height="130" rx="14" fill="#fff8ec" stroke="#dfc392" stroke-width="1.5"/>
<text x="840" y="1074" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Personal chat exports</text>
<text x="840" y="1105" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">WhatsApp / Telegram / WeChat</text>
<text x="840" y="1133" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">TXT / ZIP / JSON / CSV</text>
<text x="840" y="1161" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Selected snapshots, not live sync</text>
<rect x="1200" y="1040" width="330" height="130" rx="14" fill="#f2effa" stroke="#beb2db" stroke-width="1.5"/>
<text x="1220" y="1074" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">WhatsApp Business</text>
<text x="1220" y="1105" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Meta signature + WABA/phone</text>
<text x="1220" y="1133" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">New webhook deliveries only</text>
<text x="1220" y="1161" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Encrypted retained originals</text>
<text x="60" y="1218" font-size="20" font-weight="700" style="fill:#142b43" text-anchor="start">One connection = owner + provider + account. One grant = Agent + connection + operation + expiry + supported constraints.</text>
<text x="60" y="1254" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Self-hosting controls persistence. Content forwarded to external models may leave this deployment.</text>
