<rect width="1600" height="1280" fill="#ffffff"/>
<text x="60" y="55" font-size="32" font-weight="700" style="fill:#142b43" text-anchor="start">Event-driven Context</text>
<text x="60" y="90" font-size="23" font-weight="400" style="fill:#4e6378" text-anchor="start">Data hub architecture and account authorization · v0.1.2</text>
<rect x="60" y="130" width="410" height="105" rx="14" fill="#edf7f4" stroke="#9bcebf" stroke-width="1.5"/>
<text x="80" y="164" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Owner</text>
<text x="80" y="195" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Browser / Android / owner CLI</text>
<text x="80" y="223" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Sign in · connect accounts · approve</text>
<rect x="550" y="130" width="490" height="105" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="570" y="164" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Agent and scripts</text>
<text x="570" y="195" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">edc + separate private Agent credential</text>
<text x="570" y="223" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Discover · request · read</text>
<rect x="1140" y="130" width="400" height="105" rx="14" fill="#f2effa" stroke="#beb2db" stroke-width="1.5"/>
<text x="1160" y="164" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">ChatGPT / Claude Web</text>
<text x="1160" y="195" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Context project tools</text>
<text x="1160" y="223" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Project MCP OAuth credential</text>
<rect x="40" y="295" width="1520" height="640" rx="14" fill="#f8fafc" stroke="#b9c8d7" stroke-width="1.5"/>
<text x="330" y="326" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="start">Deployer-controlled server and storage</text>
<rect x="70" y="345" width="970" height="550" rx="14" fill="#fff" stroke="#d2dce7" stroke-width="1.5"/>
<rect x="1130" y="345" width="400" height="550" rx="14" fill="#fff" stroke="#beb2db" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="100" y="370" width="370" height="120" rx="14" fill="#edf7f4" stroke="#9bcebf" stroke-width="1.5"/>
<text x="120" y="404" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Owner setup and approval API</text>
<text x="120" y="435" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Owner session; Google OAuth + PKCE</text>
<text x="120" y="463" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Source credentials and grant decisions</text>
<rect x="550" y="370" width="460" height="120" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="570" y="404" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Agent read authorization gate</text>
<text x="570" y="435" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Agent + owner + connection + operation</text>
<text x="570" y="463" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Expiry + constraints; checked twice</text>
<rect x="100" y="550" width="910" height="120" rx="14" fill="#f3f7fb" stroke="#c6d4e2" stroke-width="1.5"/>
<text x="120" y="584" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Source adapters and ingestion</text>
<text x="120" y="615" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Fixed API endpoints · owner-selected import parser · signed webhook receiver</text>
<text x="120" y="643" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Server-held credentials; bounded results; no automatic project Event writes</text>
<rect x="100" y="755" width="430" height="120" rx="14" fill="#f3f7fb" stroke="#c6d4e2" stroke-width="1.5"/>
<text x="120" y="789" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">SQLite</text>
<text x="120" y="820" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Identity, connections and grants</text>
<text x="120" y="848" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Encrypted secrets and Business receipts</text>
<rect x="580" y="755" width="430" height="120" rx="14" fill="#fff8ec" stroke="#dfc392" stroke-width="1.5"/>
<text x="600" y="789" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">&lt;data&gt;/hub-imports</text>
<text x="600" y="820" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Immutable originals and manifests</text>
<text x="600" y="848" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Plaintext files; private permissions</text>
<rect x="1160" y="370" width="340" height="120" rx="14" fill="#f2effa" stroke="#beb2db" stroke-width="1.5"/>
<text x="1180" y="404" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Project /mcp</text>
<text x="1180" y="435" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Context OAuth scopes</text>
<text x="1180" y="463" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">+ project membership</text>
<rect x="1160" y="605" width="340" height="150" rx="14" fill="#f2effa" stroke="#beb2db" stroke-width="1.5"/>
<text x="1180" y="639" font-size="22" font-weight="700" style="fill:#142b43" text-anchor="start">Project storage</text>
<text x="1180" y="670" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Events / Files / metadata</text>
<text x="1180" y="698" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Append-only via product interfaces</text>
<text x="1180" y="726" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">Derived State and processing</text>
<text x="1155" y="814" font-size="18" font-weight="700" style="fill:#142b43" text-anchor="start">Project and Hub grants are separate.</text>
<text x="1155" y="844" font-size="18" font-weight="400" style="fill:#4e6378" text-anchor="start">No automatic source-to-project archive.</text>
