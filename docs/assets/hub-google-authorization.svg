<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="998" viewBox="0 0 1500 998" role="img" aria-labelledby="title description">
<title id="title">Google account authorization</title>
<desc id="description">Repeat for every selected service and account; Agent grants remain separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4e6378"/></marker></defs>
<style>text {font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #142b43} .line {fill:none;stroke:#4e6378;stroke-width:2.2}</style>
<rect width="1500" height="998" fill="#ffffff"/>
<text x="50" y="50" font-size="30" font-weight="700" style="fill:#142b43" text-anchor="start">Google account authorization</text>
<text x="50" y="88" font-size="21" font-weight="400" style="fill:#4e6378" text-anchor="start">Repeat for every selected service and account; Agent grants remain separate.</text>
<rect x="22.0" y="125" width="216" height="65" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="130.0" y="166" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="middle">Owner browser</text>
<path d="M130.0 190 L130.0 903" class="line" stroke-dasharray="6 5"/>
<rect x="435.33333333333326" y="125" width="216" height="65" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="543.3333333333333" y="166" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="middle">Context Hub</text>
<path d="M543.3333333333333 190 L543.3333333333333 903" class="line" stroke-dasharray="6 5"/>
<rect x="848.6666666666666" y="125" width="216" height="65" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="956.6666666666666" y="166" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="middle">Google</text>
<path d="M956.6666666666666 190 L956.6666666666666 903" class="line" stroke-dasharray="6 5"/>
<rect x="1262.0" y="125" width="216" height="65" rx="14" fill="#edf4fc" stroke="#a1bedf" stroke-width="1.5"/>
<text x="1370.0" y="166" font-size="21" font-weight="700" style="fill:#142b43" text-anchor="middle">Private storage</text>
<path d="M1370.0 190 L1370.0 903" class="line" stroke-dasharray="6 5"/>
<text x="336.66666666666663" y="235" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">1. Start with owner session + provider</text>
<path d="M130.0 247 L543.3333333333333 247" class="line" marker-end="url(#arrow)"/>
<text x="956.6666666666666" y="312" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">2. Bind state + PKCE to owner/provider; 10 minutes, one use</text>
<path d="M543.3333333333333 324 L1370.0 324" class="line" marker-end="url(#arrow)"/>
<text x="336.66666666666663" y="389" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">3. Authorization URL + callback cookie</text>
<path d="M543.3333333333333 401 L130.0 401" class="line" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="543.3333333333333" y="466" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">4. Select account; consent to service scopes</text>
<path d="M130.0 478 L956.6666666666666 478" class="line" marker-end="url(#arrow)"/>
<text x="543.3333333333333" y="543" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">5. Redirect with code + state</text>
<path d="M956.6666666666666 555 L130.0 555" class="line" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="336.66666666666663" y="620" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">6. Callback + matching browser cookie</text>
<path d="M130.0 632 L543.3333333333333 632" class="line" marker-end="url(#arrow)"/>
<text x="750.0" y="697" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">7. Exchange code with PKCE; check scopes + account</text>
<path d="M543.3333333333333 709 L956.6666666666666 709" class="line" marker-end="url(#arrow)"/>
<text x="956.6666666666666" y="774" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">8. Save encrypted connection; reconnect revokes old grants</text>
<path d="M543.3333333333333 786 L1370.0 786" class="line" marker-end="url(#arrow)"/>
<text x="336.66666666666663" y="851" font-size="19" font-weight="400" style="fill:#142b43" text-anchor="middle">9. Account connected; no Agent read grant yet</text>
<path d="M543.3333333333333 863 L130.0 863" class="line" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="50" y="966" font-size="20" font-weight="700" style="fill:#167862" text-anchor="start">Application credentials identify the app. Only each account&#x27;s consent grants source data access.</text>
</svg>
